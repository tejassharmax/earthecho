# Render Blueprint: one free Docker web service. Showcase places come from backend/demo; analyses of new
# places are forwarded to the Hugging Face Space (ANALYSIS_BACKEND), so no Earthdata token is needed here.
services:
  - type: web
    name: earthecho
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # New-place analyses run on the Hugging Face Space (16 CPUs); this free instance forwards them
      - key: ANALYSIS_BACKEND
        value: https://ttejuuu-earthecho.hf.space
